name: Update fund NAV history
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 2-6'
permissions:
  contents: write
concurrency:
  group: nav-history-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12', cache: pip}
      - uses: actions/setup-node@v6
        with: {node-version: '22'}
      - run: python -m pip install -r requirements.txt
      - run: python scripts/update_nav.py --range 1mo
      - run: |
          npm test
          pytest -q
      - name: Commit verified NAV changes
        shell: bash
        run: |
          if git diff --quiet -- data/nav-history.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nav-history.json
          git commit -m "data: update published fund NAVs"
          git push
