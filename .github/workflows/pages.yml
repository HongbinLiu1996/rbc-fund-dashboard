name: Deploy dashboard to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Update fund NAV history]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Stage public website files only
        run: |
          mkdir _site
          cp index.html manifest.webmanifest .nojekyll _site/
          cp -R src assets data _site/
      - uses: actions/upload-pages-artifact@v4
        with: {path: '_site'}
      - id: deployment
        uses: actions/deploy-pages@v4
